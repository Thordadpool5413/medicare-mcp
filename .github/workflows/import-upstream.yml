name: Import upstream medicare-mcp

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Clone upstream repository
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          git clone --depth 1 https://github.com/openpharma-org/medicare-mcp.git "$work_dir/upstream"

          rsync -a --delete --exclude '.git' "$work_dir/upstream/" "$GITHUB_WORKSPACE/"

      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No upstream changes to import."
            exit 0
          fi

          git add -A
          git commit -m "Import upstream medicare-mcp source"
          git push
