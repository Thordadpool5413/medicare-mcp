name: Build Medicare Intelligence Console

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Show runtime versions
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd repo
          npm install

      - name: Build TypeScript app
        run: |
          set -euo pipefail
          cd repo
          npm run build
