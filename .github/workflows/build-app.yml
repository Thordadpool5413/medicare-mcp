name: Build Medicare Intelligence Console

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Show runtime versions
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd repo
          npm install

      - name: Build TypeScript app
        run: |
          set -euo pipefail
          cd repo
          npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          cd repo
          test -f build/index.js
          test -f build/web.js
          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css
          echo "Build output verified."

      - name: Package deployable app
        run: |
          set -euo pipefail
          cd repo
          mkdir -p dist-package
          cp -R build public data package.json package-lock.json README.md .env.example dist-package/
          tar -czf medicare-intelligence-console.tar.gz -C dist-package .
          ls -lh medicare-intelligence-console.tar.gz

      - name: Store packaged app artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicare-intelligence-console
          path: repo/medicare-intelligence-console.tar.gz
          retention-days: 14
